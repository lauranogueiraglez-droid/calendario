<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Adviento</title>
<meta name="theme-color" content="#1b130e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Adviento">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: juego de bloques, alegre y nevado, pero legible.
   IDEA: un corte del mundo: cielo y nieve arriba, y bajo tierra 24 bloques que se pican como si fueran minerales.
   PICTURE: la rejilla de bloques con texturas de píxel generadas, que se agrietan y estallan al tocarlos.
   COLOUR and TYPE: cielo elegible, hierba nevada, tierra oscura; Press Start 2P para números y botones, VT323 para leer.
   LAYOUT: cielo con título, franja de hierba, subsuelo con la rejilla 4 columnas (5 en pantallas anchas). */
:root{--sky1:#6fb8ea;--sky2:#cfeeff;--ink:#fff;--txt:#f3ead8;--panel:#2a201a;--gold:#ffd84a;--red:#e04a3a;--px:4px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#1b130e;color:var(--txt);font:22px/1.25 VT323,ui-monospace,monospace;overflow-x:hidden}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.sky{position:relative;background:linear-gradient(var(--sky1),var(--sky2));padding:28px 16px 18px;overflow:hidden}
.sky .in{max-width:1000px;margin:0 auto;position:relative;z-index:1}
h1{font:400 26px/1.35 "Press Start 2P",monospace;margin:0;color:#fff;text-shadow:3px 3px 0 #2b2b2b}
h1 em{font-style:normal;color:var(--gold)}
.intro{margin:12px 0 0;color:#16324a;font-size:24px}
.night .intro{color:#dce8ff}
.status{margin:14px 0 0;display:inline-block;background:rgba(0,0,0,.45);color:#fff;padding:8px 12px;font-size:22px}
.status b{color:#8cff5a;font-weight:400}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sky #orb{position:absolute;top:22px;right:7%;width:46px;height:46px;z-index:0}
#orb.sun{background:#ffe066;box-shadow:inset -6px -6px 0 #f5c542,0 0 0 6px rgba(255,236,140,.35)}
#orb.dusk{top:auto;bottom:10px;background:#ffb04d;box-shadow:inset -6px -6px 0 #f0782e,0 0 0 8px rgba(255,160,80,.3)}
#orb.moon{background:#e8ecf5;box-shadow:inset -6px -6px 0 #c3c9d8,0 0 0 6px rgba(220,230,255,.12)}
#orb.moon::before,#orb.moon::after{content:"";position:absolute;background:#c3c9d8;width:9px;height:9px;left:10px;top:12px}
#orb.moon::after{width:6px;height:6px;left:26px;top:26px}
#stars{position:absolute;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;width:2px;height:2px;background:#fff;opacity:.8}
@media(max-width:639px){.sky #orb{width:34px;height:34px;top:14px;right:14px}}
.flake{position:absolute;top:-10px;width:5px;height:5px;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),110vh)}}
.grass{height:48px;background-size:48px 48px;background-repeat:repeat-x}
.under{background-size:96px 96px;padding:22px 12px 40px;position:relative}
.under::before{content:"";position:absolute;inset:0;background:rgba(10,6,3,.55);pointer-events:none}
.under .in{position:relative;max-width:1000px;margin:0 auto}
button,.btn{font:400 11px/1.4 "Press Start 2P",monospace;color:#fff;text-shadow:2px 2px 0 #3a3a3a;min-height:44px;padding:0 14px;border:3px solid #111;background:#7d7d7d;box-shadow:inset 3px 3px 0 #a9a9a9,inset -3px -3px 0 #555;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:0}
button:active,.btn:active{box-shadow:inset -3px -3px 0 #a9a9a9,inset 3px 3px 0 #555}
button.on{background:#4f8a2c;box-shadow:inset 3px 3px 0 #7cc04a,inset -3px -3px 0 #2f5a17}
.primary{background:#4f8a2c;box-shadow:inset 3px 3px 0 #7cc04a,inset -3px -3px 0 #2f5a17}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.door{position:relative;aspect-ratio:1/1;border:0;padding:0;background:#0d0906;box-shadow:inset 4px 4px 0 #000;min-height:0;text-shadow:none;cursor:pointer}
.door .face{position:absolute;inset:0;background-size:100% 100%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:7px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.18)}
.num{font:400 20px/1 "Press Start 2P",monospace;color:#fff;text-shadow:3px 3px 0 #000}
.tag{font:400 8px/1.2 "Press Start 2P",monospace;color:#fff;text-shadow:2px 2px 0 #000;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crack{position:absolute;inset:0;background-size:100% 100%;pointer-events:none}
.door.locked .face{filter:brightness(.55) saturate(.7)}
.door.today{outline:4px solid var(--gold);outline-offset:-2px;z-index:1}
.door.today .tag{color:var(--gold)}
.door.open .face{display:none}
.door .item{position:absolute;inset:22%;display:none}
.door.open .item{display:block}
.door.edit.empty .face{filter:grayscale(1) brightness(.7)}
.door.big .num{font-size:26px}
.note{margin:18px 0 0;font-size:20px;color:#d9cdb6}
.lnk{background:none;border:0;box-shadow:none;padding:0;min-height:44px;color:#d9cdb6;text-decoration:underline;font:20px VT323,monospace;text-shadow:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.ov.show{display:flex}
.sheet{background:var(--panel);border:4px solid #0b0806;box-shadow:inset 4px 4px 0 #4a3a2e,inset -4px -4px 0 #140f0c;width:100%;max-width:560px;max-height:calc(100vh - 24px);overflow:auto;padding:22px 18px;position:relative}
.x{position:absolute;top:10px;right:10px;width:44px;padding:0}
.kick{font:400 10px/1.4 "Press Start 2P",monospace;color:var(--gold);margin:0 50px 10px 0}
.sheet h2{font:400 18px/1.45 "Press Start 2P",monospace;color:#fff;text-shadow:3px 3px 0 #000;margin:0 50px 16px 0}
.msg{white-space:pre-wrap;margin:0 0 18px;font-size:24px}
.photo{width:100%;display:block;margin:0 0 18px;border:4px solid #0b0806}
.vale{background:#3a2c22;border:4px dashed var(--gold);padding:12px 14px;margin:0 0 18px}
.vale span{font:400 9px "Press Start 2P",monospace;color:var(--gold)}.vale p{margin:6px 0 0;font-size:26px;color:#fff}
.from{color:#bfb39c;margin:18px 0 0}
.lockmsg{color:#d9cdb6}
.preview{font-size:19px;color:#bfb39c;border-top:3px dashed #4a3a2e;padding-top:10px;margin-top:20px}
label{display:block;font:400 9px/1.5 "Press Start 2P",monospace;color:#fff;margin:16px 0 6px}
label small{font:18px VT323,monospace;color:#bfb39c}
input[type=text],input[type=url],input[type=number],input[type=password],textarea{width:100%;font:22px/1.2 VT323,monospace;padding:8px 10px;border:3px solid #000;background:#120d0a;color:#fff;border-radius:0}
input[type=file]{font:18px VT323,monospace;color:#d9cdb6;max-width:100%}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:22px}
.thumb{max-width:120px;display:block;margin:8px 0;border:3px solid #000}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:auto;font-size:9px}
.err{color:#ff7b6b;min-height:22px;margin:6px 0 0}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;font:400 10px/1.4 "Press Start 2P",monospace;display:none;z-index:30;white-space:nowrap;border:3px solid #000}
select{width:100%;font:22px VT323,monospace;padding:8px 10px;border:3px solid #000;background:#120d0a;color:#fff;border-radius:0}
.game{max-width:360px;margin:6px auto 0}
.gst{font-size:24px;color:#fff;min-height:30px;margin:12px 0 0;text-align:center}
.gst b{color:#8cff5a;font-weight:400}
.gblock{width:104px;height:104px;margin:6px auto 4px;position:relative;background-size:100% 100%;border:3px solid #000}
.gblock .crack{background-size:100% 100%}
.bar{position:relative;height:46px;background:#120d0a;border:3px solid #000;margin:14px 0 12px;overflow:visible}
.zone{position:absolute;top:0;bottom:0;background:#4f8a2c;box-shadow:inset 3px 3px 0 #7cc04a}
.cur{position:absolute;top:-7px;bottom:-7px;width:8px;margin-left:-4px;background:#fff;border:2px solid #000}
.big-btn{width:100%;min-height:56px;font-size:13px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card,.hole,.sb{aspect-ratio:1/1;min-height:0;padding:0;border:3px solid #000;background-size:100% 100%;box-shadow:none;border-radius:0}
.card{background-color:#4a4a4a;box-shadow:inset 3px 3px 0 #6b6b6b,inset -3px -3px 0 #2b2b2b;font-size:16px}
.card.up,.card.done{box-shadow:none}
.card.done{opacity:.55}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hole{position:relative;box-shadow:inset 8px 8px 0 rgba(0,0,0,.55)}
.hole .it{position:absolute;inset:12%;pointer-events:none}
.hole.ouch{outline:4px solid #ff5a3a}
.simon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sb{filter:brightness(.55);transition:filter .1s}
.sb.lit{filter:brightness(1.3);outline:4px solid #fff;outline-offset:-4px}
.ctr{justify-content:center}
.sub{font-size:20px;color:#bfb39c;margin:8px 0 6px;text-align:center}
.word{font:400 18px/1.6 "Press Start 2P",monospace;color:#fff;text-shadow:3px 3px 0 #000;text-align:center;margin:10px 0 14px;word-break:break-all}
.g3,.g4,.gg{display:grid;gap:6px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g4.small{max-width:132px;margin:0 auto;gap:3px}
.cell{aspect-ratio:1/1;min-height:0;padding:0;border:3px solid #000;background-color:#120d0a;background-size:100% 100%;box-shadow:none;border-radius:0;position:relative;display:flex;align-items:center;justify-content:center}
.cell.mini{border-width:2px}
.tile span,.num-c span{font:400 22px "Press Start 2P",monospace;color:#fff;text-shadow:3px 3px 0 #000}
.num-c.done{opacity:.25}
.hole0{background:#0b0806;box-shadow:inset 6px 6px 0 #000}
.torch{background:#2b2b2b}
.torch i{width:22%;height:60%;background:#5a3d22;position:relative;display:block}
.torch.lit{background:#3a2c1c;box-shadow:inset 0 0 0 3px #ffd84a}
.torch.lit i::before{content:"";position:absolute;left:-30%;right:-30%;top:-40%;height:45%;background:#ffd84a;box-shadow:0 0 18px 6px rgba(255,200,60,.6)}
.torch:not(.lit) i::before{content:"";position:absolute;left:0;right:0;top:-15%;height:20%;background:#3b3b3b}
.maze{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;border:3px solid #000}
.mz{aspect-ratio:1/1;min-height:0;padding:0;border:0;box-shadow:none;border-radius:0;background-size:100% 100%;position:relative}
.mz:not([data-w]){filter:brightness(.8)}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}
.pad button{min-height:52px;padding:0;font-size:14px}
.letters,.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.let{min-width:44px;font-size:14px;padding:0 10px}
.let:disabled{opacity:.3}
.kb .key{min-width:38px;min-height:42px;padding:0 6px;font-size:11px}
.kb .key:disabled{opacity:.25}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:#0b0806;border:3px solid #000;padding:3px;background-image:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4))}
.lc{height:40px;position:relative;background:#1f1712}
.lc .it{left:22%;width:56%;top:3px;height:calc(100% - 6px)}
.half{flex:1}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{font-size:14px;min-height:56px}
.sw-b{border:3px solid #000;box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -3px -3px 0 rgba(0,0,0,.3)}
.rx{display:block;padding:0;width:150px;height:150px;min-height:0;border:3px solid #000;background-size:100% 100%;box-shadow:none}
.cups{position:relative;height:150px;margin:10px 0}
.cup{position:absolute;bottom:0;width:30%;aspect-ratio:1/1;min-height:0;padding:0;border:3px solid #000;background-size:100% 100%;box-shadow:none;transition:left .55s ease-in-out,transform .3s;z-index:2}
.cup.lift{transform:translateY(-46px)}
.gemspot{position:absolute;bottom:4px;width:30%;height:40px;transition:left .55s ease-in-out,opacity .2s;opacity:0;z-index:1}
.gemspot .it{position:absolute;left:30%;right:30%;top:0;bottom:0;width:40%;height:100%}
.tw{position:relative;height:270px;background:#120d0a;border:3px solid #000;overflow:hidden;margin-bottom:10px}
.fl{position:absolute;height:30px;background-size:30px 30px;border:2px solid #000}
.water{position:relative;height:150px;background:#2c5fa8;border:3px solid #000;margin-bottom:10px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 8px,transparent 8px 24px)}
.bob{position:absolute;left:46%;top:38%;width:20px;height:28px;background:linear-gradient(#e04a3a 50%,#fff 50%);border:2px solid #000;transition:transform .15s}
.bob.down{transform:translateY(22px)}
.water{overflow:hidden}
.caught{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);animation:reel 1.4s cubic-bezier(.2,.8,.3,1) forwards;z-index:3}
.caught.small{width:64px}
.caught .fishy,.caught.small .fishy{width:100%;display:block}
span.caught:not(.small){width:120px}
.photo-catch{width:auto;max-width:78%;max-height:86%;border:4px solid #fff;outline:3px solid #000;background:#fff}
@keyframes reel{0%{transform:translate(-50%,110%) rotate(-8deg)}60%{transform:translate(-50%,-14px) rotate(4deg)}100%{transform:translate(-50%,-10px) rotate(0)}}
@media(prefers-reduced-motion:reduce){.caught{animation:none;transform:translate(-50%,-10px)}}

.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.mc{border-width:2px}.mc.op{box-shadow:inset 0 0 0 100px rgba(0,0,0,.28)}
.mc b{font:400 14px "Press Start 2P",monospace;text-shadow:2px 2px 0 #000}
.n1{color:#7ec8ff}.n2{color:#8cff5a}.n3{color:#ff7b6b}.n4{color:#d38cff}.n5{color:#ffd84a}
.flag{background:#ffd84a;left:38%;width:24%;top:18%;height:64%;box-shadow:0 0 10px 3px rgba(255,200,60,.6)}
.sopa{display:grid;gap:2px}
.sl{min-height:0;aspect-ratio:1/1;padding:0;font:400 12px "Press Start 2P",monospace;background:#3a2c22;box-shadow:none;border:2px solid #000;text-shadow:none;color:#f3ead8}
.sl.got{background:#4f8a2c;color:#fff}.sl.pick{background:#ffd84a;color:#000}
.wl{text-align:center;font-size:22px;margin:12px 0 0;color:#fff}.wl s{color:#8cff5a}
.pk{width:100%;display:block;border:3px solid #000;margin-bottom:10px;touch-action:manipulation}
.it{position:absolute;left:10%;top:10%;width:80%;height:80%}
.intro .ln{display:block;white-space:nowrap}.intro.wrap .ln{white-space:normal}
.tools .sec{background:#5b4a8a;box-shadow:inset 3px 3px 0 #8a77c4,inset -3px -3px 0 #3a2d5e}
.ups{display:flex;gap:14px;align-items:center;margin:0 44px 12px 0}
.ups img{width:64px;height:64px;flex:none;border:3px solid #000;background:#6fb8ea}
.ups h2{margin:0!important;font-size:15px!important}
.ups .kick{margin:0 0 6px}
.simbar{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#5b4a8a;border-bottom:3px solid #000;padding:8px 12px;color:#fff;font-size:20px}
.simbar span{flex:1 1 200px}
.simbar button{min-height:38px;font-size:9px}
.loot{display:flex;gap:12px;align-items:center;background:#120d0a;border:3px solid #000;padding:10px 12px;margin:0 0 16px}
.loot img{width:44px;height:44px;flex:none}
.loot span{display:block;font:400 8px/1.5 "Press Start 2P",monospace;color:#bfb39c}
.loot b{font-weight:400;font-size:24px;color:#fff}
.loot.new{border-color:#ffd84a;animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.inv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:0 0 14px}
.slot{aspect-ratio:1/1;background:#120d0a;border:3px solid #000;box-shadow:inset 3px 3px 0 #000,inset -2px -2px 0 #3a2c22;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.slot b{font:400 9px "Press Start 2P",monospace;color:#4a3a2e}
.slot.last{border-color:#6b5520}
.slot img{width:70%;height:70%}
.slot span{position:absolute;inset:auto 0 -2px 0;font-size:12px;line-height:1;text-align:center;color:#d9cdb6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
@media(min-width:520px){.slot span{display:block}.slot img{width:58%;height:58%;margin-bottom:8px}}
.spl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;transition:opacity .9s;overflow:hidden}
.spl.out{opacity:0;pointer-events:none}
.sp-load,.sp-wel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.sp-load{transition:opacity .6s}.sp-load.fade{opacity:0;pointer-events:none}
.sp-scene{position:relative;width:230px;height:150px}
.sp-av{position:absolute;left:30px;bottom:0;width:64px;height:132px;animation:bob .5s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.sp-pick{position:absolute;left:78px;bottom:40px;width:44px;height:44px;transform-origin:50% 100%;animation:swing .5s ease-in infinite}
@keyframes swing{0%{transform:rotate(-55deg)}70%{transform:rotate(35deg)}100%{transform:rotate(-55deg)}}
.sp-blk{position:absolute;left:130px;bottom:0;width:64px;height:64px;background-size:100% 100%;border:3px solid #000}
.sp-ground{width:230px;height:24px;background-size:24px 24px;margin-bottom:22px}
.sp-tip{font-size:24px;color:#fff;text-shadow:2px 2px 0 #000;margin:0 0 10px;min-height:30px}
.sp-bar{width:230px;height:22px;border:3px solid #000;background:#2a201a}
.sp-bar i{display:block;height:100%;width:0;background:#4f8a2c;box-shadow:inset 0 3px 0 #7cc04a}
.sp-wel{opacity:0;transition:opacity .8s;pointer-events:none}
.sp-wel.show{opacity:1;pointer-events:auto}
.sp-big{width:96px;height:198px;margin-bottom:18px}
.sp-wel h2{font:400 22px/1.4 "Press Start 2P",monospace;color:#fff;text-shadow:3px 3px 0 #000;margin:0 0 10px}
.sp-wel p{font-size:24px;color:#fff;text-shadow:2px 2px 0 #000;margin:0 0 8px;max-width:30ch}
.sp-wel .sp-sub{font-size:20px;opacity:.9;margin-bottom:22px}
.sp-wel .big-btn{max-width:260px}
@media(prefers-reduced-motion:reduce){.sp-av,.sp-pick{animation:none}}
.hero-img{image-rendering:pixelated}
@media(min-width:640px){h1{font-size:40px}.sky{padding:48px 5vw 26px}#grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.door.big{grid-column:span 2;aspect-ratio:auto}.num{font-size:28px}.door.big .num{font-size:40px}.tag{font-size:9px}.under{padding:32px 5vw 56px}.sheet{padding:34px}}
@media(prefers-reduced-motion:reduce){.flake{display:none}}
</style>
</head>
<body>
<section class="sky" id="sky"><div class="in">
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>
  <div class="status" id="status"></div>
  <div class="tools" id="tools"></div>
</div></section>
<div class="grass pix" id="grass"></div>
<section class="under pix" id="under"><div class="in">
  <div id="grid"></div>
  <p class="note" id="note"></p>
  <div id="foot"></div>
</div></section>
<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<canvas id="cf" hidden></canvas>

function tone(f,t,d){
  [['square',f,.022],['triangle',f/2,.045]].forEach(function(v){
    var o=AC.createOscillator(),g=AC.createGain();o.type=v[0];o.frequency.value=v[1];

    o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+d+.03);
  });
}

  ['E2','B2',['G3','B3','D4','E4','G4','B4']],['A2','E3',['C4','E4','G4','A4','C5','E5']],['D3','A3',['F4','A4','C5','E5','F5']],['G2','D3',['B3','D4','F4','G4','B4','D5']]];

  var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();
  o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;g2.gain.value=.18;

}
function schedChill(){
  var spb=60/66;
  while(MUS.next<AC.currentTime+.8){
    var b=MUS.idx,bar=Math.floor(b/8),c=CHILL[bar%CHILL.length],t=MUS.next,rest=(bar%9===8);
    if(!rest){
      if(b%8===0)piano(noteF(c[0]),t,.085,5);
      if(b%8===4&&Math.random()<.7)piano(noteF(c[1]),t,.05,4);
      if(Math.random()<(b%8===0?.8:.42)){var n=c[2][(Math.random()*c[2].length)|0];piano(noteF(n),t+(Math.random()<.35?spb/2:0),.035+Math.random()*.03,3.6)}
      if(Math.random()<.08){var n2=c[2][(Math.random()*c[2].length)|0];piano(noteF(n2),t+spb*.75,.025,3)}
    }
    MUS.idx++;MUS.next+=spb;
  }
}
function sched(){
  if((D.musica||'chill')==='chill')return schedChill();
  var sg=SONGS[MUS.song],spb=60/sg[0];
  while(MUS.next<AC.currentTime+.5){
    var nt=sg[1][MUS.idx];tone(noteF(nt[0]),MUS.next,nt[1]*spb*.92);MUS.next+=nt[1]*spb;MUS.idx++;
    if(MUS.idx>=sg[1].length){MUS.idx=0;MUS.song=(MUS.song+1)%SONGS.length;MUS.next+=spb*3;sg=SONGS[MUS.song];spb=60/sg[0]}
  }
}
function musicStart(){
  MUS.want=true;if(!MUS.on||MUS.playing)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return}
  MUS.gain=AC.createGain();MUS.gain.connect(AC.destination);
  MUS.bus=AC.createBiquadFilter();MUS.bus.type='lowpass';MUS.bus.frequency.value=2400;MUS.bus.connect(MUS.gain);
  var dl=AC.createDelay(2),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.46;fb.gain.value=.38;wet.gain.value=.32;
  MUS.bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(MUS.gain);

}

function mine(b,n){

var HERO='<svg class="it pix" viewBox="0 0 8 8" shape-rendering="crispEdges"><path fill="#ffd84a" d="M0 0h8v8h-8z"/><path fill="#c9a21c" d="M0 6h8v2h-8z"/><path fill="#1b130e" d="M2 2h1v2h-1zM5 2h1v2h-1zM3 5h2v1h-2z"/></svg>';
function normWord(w){w=String(w||'').toUpperCase().replace(/Ñ/g,'#').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/#/g,'Ñ').replace(/[^A-ZÑ]/g,'');return w.length>=3?w.slice(0,14):''}
var WORDS=['REGALO','NIEVE','ABETO','TURRON','ESTRELLA','CAMPANA','RENO','BELEN','POLVORON','CHIMENEA','GUIRNALDA','BUFANDA','VILLANCICO','CALCETIN','MAZAPAN'];

function play(n,k,onWin,draft){
  stopGame();
  var g=GAMES[k];
  openSheet('<p class="kick">Bloque '+n+' · minijuego</p><h2>'+g[0]+'</h2><p class="lockmsg">'+g[1]+'</p><div class="game" id="game"></div><p class="gst" id="gst"></p><div class="row" id="grow"></div>');
  var el=$('#game'),st=$('#gst');
  function win(){stopGame();if(k!=='pesca'){beep([523,659,784,1047],'square');st.innerHTML='<b>¡Superado!</b>'}later(function(){close();onWin()},700)}
  function lose(msg){stopGame();beep([220,165,110],'square');st.textContent=msg;$('#grow').innerHTML='<button class="primary" id="again">Reintentar</button><button data-close>Salir</button>';$('#again').onclick=function(){play(n,k,onWin,draft)}}
  GFN[k](el,st,win,lose,n,draft||D.doors[n]||{});
}

function gPicar(el,st,win,lose,n){
  var hits=0,pos=0,dir=1,speed=.011,zl,zw=.2;
  el.innerHTML='<div class="gblock pix" id="gb" style="background-image:url('+TEX[matOf(n)]+')"><span class="crack pix" id="gc"></span></div><div class="bar" id="bar"><div class="zone" id="zn"></div><div class="cur" id="cu"></div></div><button class="primary big-btn" id="hit">¡Picar!</button>';
  function place(){zl=.08+Math.random()*(.84-zw);$('#zn').style.left=(zl*100)+'%';$('#zn').style.width=(zw*100)+'%'}
  place();st.textContent='Golpes: 0 / 3';
  (function loop(){pos+=dir*speed;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}$('#cu').style.left=(pos*100)+'%';RAF=requestAnimationFrame(loop)})();
  $('#hit').onclick=function(){
    if(pos>=zl&&pos<=zl+zw){hits++;noise();$('#gc').style.backgroundImage='url('+CRACK[Math.min(hits,3)-1]+')';st.textContent='Golpes: '+hits+' / 3';
      if(hits>=3)return win();speed*=1.3;zw*=.85;place()}
    else{beep([150],'square');var b=$('#bar');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
  };
}

function gMemoria(el,st,win){
  var mats=shuffle(['piedra','tablas','ladrillo','hielo','hojas','oro','tierra','nieve']).slice(0,6),cards=shuffle(mats.concat(mats)),up=[],done=0,busy=false,tries=0;
  el.innerHTML='<div class="mem">'+cards.map(function(m,i){return '<button class="card pix" data-i="'+i+'" aria-label="Carta">?</button>'}).join('')+'</div>';
  st.textContent='Parejas: 0 / 6';
  el.querySelectorAll('.card').forEach(function(c){c.onclick=function(){
    if(busy||c.classList.contains('up')||c.classList.contains('done'))return;
    c.classList.add('up');c.textContent='';c.style.backgroundImage='url('+TEX[cards[+c.dataset.i]]+')';up.push(c);noise();
    if(up.length===2){tries++;var a=up[0],b=up[1];up=[];
      if(cards[+a.dataset.i]===cards[+b.dataset.i]){a.classList.add('done');b.classList.add('done');done++;beep([660,880],'square');st.textContent='Parejas: '+done+' / 6';if(done===6)win()}
      else{busy=true;later(function(){[a,b].forEach(function(x){x.classList.remove('up');x.style.backgroundImage='';x.textContent='?'});busy=false},750)}}
  }});
}

function gGemas(el,st,win,lose){
  var score=0,left=25,need=10;
  el.innerHTML='<div class="holes">'+[0,1,2,3,4,5,6,7,8].map(function(i){return '<button class="hole pix" data-i="'+i+'" aria-label="Hueco" style="background-image:url('+TEX.tierra+')"></button>'}).join('')+'</div>';
  var holes=el.querySelectorAll('.hole');
  function show(){st.innerHTML='Gemas: <b>'+score+'</b> / '+need+' · Tiempo: '+left+' s'}
  show();
  holes.forEach(function(h){h.onclick=function(){
    if(h.dataset.k==='gem'){score++;h.dataset.k='';h.innerHTML='';beep([880,1175],'square');show();if(score>=need)win()}
    else if(h.dataset.k==='lava'){score=Math.max(0,score-2);h.dataset.k='';h.innerHTML='';h.classList.add('ouch');later(function(){h.classList.remove('ouch')},300);beep([130],'sawtooth');show()}
  }});
  function spawn(){
    var free=[].filter.call(holes,function(h){return !h.dataset.k});if(!free.length)return;
    var h=free[(Math.random()*free.length)|0],lava=Math.random()<.22;
    h.dataset.k=lava?'lava':'gem';
    h.innerHTML=lava?'<span class="it pix" style="background-image:url('+TEX.lava+');background-size:100% 100%"></span>':GEM;
    later(function(){if(h.dataset.k){h.dataset.k='';h.innerHTML=''}},lava?1300:950);
  }
  every(spawn,620);
  every(function(){left--;show();if(left<=0)lose('¡Se acabó el tiempo! Llevabas '+score+' de '+need+'.')},1000);
}

function gSecuencia(el,st,win,lose,n){
  var mats=['oro','hielo','hojas','ladrillo'],notes=[392,494,587,698],target=n===24?6:5,seq=[],idx=0,listen=false;
  el.innerHTML='<div class="simon">'+mats.map(function(m,i){return '<button class="sb pix" data-i="'+i+'" aria-label="Bloque '+(i+1)+'" style="background-image:url('+TEX[m]+')"></button>'}).join('')+'</div>';
  var bs=el.querySelectorAll('.sb');
  function lit(i,ms){bs[i].classList.add('lit');beep([notes[i]],'square');later(function(){bs[i].classList.remove('lit')},ms)}
  function round(){
    seq.push((Math.random()*4)|0);idx=0;listen=false;st.textContent='Mira… ('+seq.length+' / '+target+')';
    seq.forEach(function(v,j){later(function(){lit(v,380)},600+j*560)});
    later(function(){listen=true;st.textContent='¡Tu turno! ('+seq.length+' / '+target+')'},600+seq.length*560);
  }
  bs.forEach(function(b){b.onclick=function(){
    if(!listen)return;var i=+b.dataset.i;lit(i,200);
    if(i!==seq[idx])return lose('¡Fallaste! Llegaste a '+(seq.length-1)+' de '+target+'.');
    idx++;
    if(idx===seq.length){listen=false;if(seq.length>=target)return later(win,250);later(round,500)}
  }});
  round();
}

GFN.picar=gPicar;GFN.memoria=gMemoria;GFN.gemas=gGemas;GFN.secuencia=gSecuencia;

/* 5 · tres en raya */
GFN.raya=function(el,st,win,lose){
  var b=['','','','','','','','',''],busy=false,L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  el.innerHTML='<div class="g3">'+b.map(function(_,i){return '<button class="cell" data-i="'+i+'" aria-label="Casilla '+(i+1)+'"></button>'}).join('')+'</div>';
  var cs=el.querySelectorAll('.cell');
  function put(i,who){b[i]=who;cs[i].style.backgroundImage='url('+TEX[who==='x'?'oro':'piedra']+')';cs[i].dataset.v=who}
  function winner(){for(var k=0;k<L.length;k++){var l=L[k];if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]]}return b.indexOf('')<0?'draw':''}
  function find(who){for(var k=0;k<L.length;k++){var l=L[k],v=l.map(function(i){return b[i]});if(v.filter(function(x){return x===who}).length===2&&v.indexOf('')>=0)return l[v.indexOf('')]}return -1}
  function ai(){
    var m=find('o');
    if(m<0&&Math.random()<.6)m=find('x');
    if(m<0&&!b[4]&&Math.random()<.5)m=4;
    if(m<0){var free=[];b.forEach(function(v,i){if(!v)free.push(i)});m=free[(Math.random()*free.length)|0]}
    put(m,'o');noise();check();busy=false;
  }
  function check(){var w=winner();if(w==='x'){win();return true}if(w==='o'){lose('Te ha ganado el aldeano. ¡Revancha!');return true}if(w==='draw'){lose('¡Empate! El empate no vale, otra vez.');return true}return false}
  st.textContent='Tu turno';
  cs.forEach(function(c){c.onclick=function(){var i=+c.dataset.i;if(busy||b[i])return;put(i,'x');noise();if(check())return;busy=true;later(ai,380)}});
};

/* 6 · laberinto */
GFN.laberinto=function(el,st,win){
  var N=9,g=[],i,j,px=1,py=1;
  for(j=0;j<N;j++){g[j]=[];for(i=0;i<N;i++)g[j][i]=1}
  (function carve(x,y){g[y][x]=0;shuffle([[2,0],[-2,0],[0,2],[0,-2]]).forEach(function(d){var nx=x+d[0],ny=y+d[1];if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&g[ny][nx]){g[y+d[1]/2][x+d[0]/2]=0;carve(nx,ny)}})})(1,1);
  var html='';for(j=0;j<N;j++)for(i=0;i<N;i++)html+='<button class="mz pix" data-x="'+i+'" data-y="'+j+'" style="background-image:url('+TEX[g[j][i]?'piedra':'subsuelo']+')"'+(g[j][i]?' data-w="1"':'')+' aria-label="Casilla"></button>';
  el.innerHTML='<div class="maze">'+html+'</div><div class="pad"><span></span><button data-d="0,-1" aria-label="Arriba">^</button><span></span><button data-d="-1,0" aria-label="Izquierda">&lt;</button><button data-d="0,1" aria-label="Abajo">v</button><button data-d="1,0" aria-label="Derecha">&gt;</button></div>';
  var cells=el.querySelectorAll('.mz');function at(x,y){return cells[y*N+x]}
  at(N-2,N-2).innerHTML='<span class="it pix" style="background-image:url('+TEX.regalo+');background-size:100% 100%"></span>';at(N-2,N-2).dataset.goal='1';
  function draw(){var o=el.querySelector('.hero');if(o)o.remove();at(px,py).insertAdjacentHTML('beforeend',HERO.replace('class="it','class="it hero'))}
  function move(dx,dy){var nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=N||ny>=N||g[ny][nx]){shk(el.querySelector('.maze'));return}px=nx;py=ny;draw();noise();if(px===N-2&&py===N-2)win()}
  draw();st.textContent='Llega al regalo';
  el.querySelectorAll('.pad button').forEach(function(b){b.onclick=function(){var d=b.dataset.d.split(',');move(+d[0],+d[1])}});
  cells.forEach(function(c){c.onclick=function(){var x=+c.dataset.x,y=+c.dataset.y;if(Math.abs(x-px)+Math.abs(y-py)===1)move(x-px,y-py)}});
  el._key=function(k){var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];if(m)move(m[0],m[1])};
};

/* 7 · el bloque raro */
GFN.diferente=function(el,st,win,lose){
  var R=[[4,1.38],[5,1.24],[6,1.15]],r=0,lives=3;
  function round(){
    var s=R[r][0],odd=rint(0,s*s-1),mat=['piedra','tablas','hojas','ladrillo','tierra','hielo'][rint(0,5)],h='';
    for(var i=0;i<s*s;i++)h+='<button class="cell pix" data-i="'+i+'"'+(i===odd?' data-odd="1"':'')+' style="background-image:url('+TEX[mat]+')'+(i===odd?';filter:brightness('+R[r][1]+')':'')+'" aria-label="Bloque"></button>';
    el.innerHTML='<div class="gg" style="grid-template-columns:repeat('+s+',minmax(0,1fr))">'+h+'</div>';
    st.textContent='Ronda '+(r+1)+' / 3 · Vidas: '+lives;
    el.querySelectorAll('.cell').forEach(function(c){c.onclick=function(){
      if(c.dataset.odd){beep([660,880]);r++;if(r>=R.length)win();else round()}
      else{lives--;shk(c);beep([150]);if(lives<=0)lose('¡Sin vidas! Mira con calma.');else st.textContent='Ronda '+(r+1)+' / 3 · Vidas: '+lives}
    }});
  }
  round();
};

/* 8 · puzle deslizante */
GFN.deslizante=function(el,st,win){
  var t=[1,2,3,4,5,6,7,8,0],last=-1,moves=0;
  function nb(i){var r=[],x=i%3,y=(i/3)|0;if(x>0)r.push(i-1);if(x<2)r.push(i+1);if(y>0)r.push(i-3);if(y<2)r.push(i+3);return r}
  for(var k=0;k<36;k++){var e=t.indexOf(0),o=nb(e).filter(function(v){return v!==last}),m=o[(Math.random()*o.length)|0];t[e]=t[m];t[m]=0;last=e}
  if(t.join()==='1,2,3,4,5,6,7,8,0'){t[7]=0;t[8]=8}
  function draw(){
    el.innerHTML='<div class="g3">'+t.map(function(v,i){return v?'<button class="cell tile pix" data-i="'+i+'" data-v="'+v+'" style="background-image:url('+TEX.tablas+')"><span>'+v+'</span></button>':'<span class="cell hole0"></span>'}).join('')+'</div>';
    st.textContent='Movimientos: '+moves;
    el.querySelectorAll('.tile').forEach(function(c){c.onclick=function(){var i=+c.dataset.i,e=t.indexOf(0);if(nb(e).indexOf(i)<0){shk(c);return}t[e]=t[i];t[i]=0;moves++;noise();draw();if(t.join()==='1,2,3,4,5,6,7,8,0')later(win,200)}});
  }
  draw();
};

/* 9 · antorchas */
GFN.antorchas=function(el,st,win){
  var on=[1,1,1,1,1,1,1,1,1];
  function press(i){[i,i%3>0?i-1:-1,i%3<2?i+1:-1,i-3,i+3].forEach(function(j){if(j>=0&&j<9)on[j]^=1})}
  shuffle([0,1,2,3,4,5,6,7,8]).slice(0,rint(3,5)).forEach(press);
  if(on.every(function(v){return v}))press(4);
  function draw(){
    el.innerHTML='<div class="g3">'+on.map(function(v,i){return '<button class="cell torch'+(v?' lit':'')+'" data-i="'+i+'" data-on="'+v+'" aria-label="Antorcha '+(v?'encendida':'apagada')+'"><i></i></button>'}).join('')+'</div>';
    st.textContent='Encendidas: '+on.filter(function(v){return v}).length+' / 9';
    el.querySelectorAll('.torch').forEach(function(c){c.onclick=function(){press(+c.dataset.i);beep([440+on.filter(Boolean).length*40]);draw();if(on.every(function(v){return v}))later(win,200)}});
  }
  draw();
};

/* 10 · anagrama */
GFN.anagrama=function(el,st,win,lose,n,d){
  var own=normWord(d.word),w=own||WORDS[rint(0,WORDS.length-1)],L=w.split(''),s=L.slice();
  while(s.join('')===w)shuffle(s);
  var built='';
  el.dataset.w=w;
  el.innerHTML='<p class="word" id="built">&nbsp;</p><div class="letters">'+s.map(function(c,i){return '<button class="let" data-c="'+c+'">'+c+'</button>'}).join('')+'</div><div class="row ctr"><button id="clr">Borrar</button></div>';
  st.textContent=own?'Pista: '+w.length+' letras':'Pista: algo navideño de '+w.length+' letras';
  function reset(){built='';$('#built').innerHTML='&nbsp;';el.querySelectorAll('.let').forEach(function(b){b.disabled=false})}
  el.querySelectorAll('.let').forEach(function(b){b.onclick=function(){
    built+=b.dataset.c;b.disabled=true;$('#built').textContent=built;noise();
    if(built.length===w.length){if(built===w)win();else{shk($('#built'));beep([150]);later(reset,500)}}
  }});
  $('#clr').onclick=reset;
};

/* 11-12 · carriles: esquiva y atrapa */
function lanes(el,st,win,lose,mode){
  var W=3,H=7,p=1,items=[],score=0,miss=0,left=mode==='esquiva'?12:15,tick=0,lives=3;
  el.innerHTML='<div class="lanes" id="ln"></div><div class="row ctr"><button id="lL" class="big-btn half" aria-label="Izquierda">&lt;</button><button id="lR" class="big-btn half" aria-label="Derecha">&gt;</button></div>';
  var ln=$('#ln');
  function draw(){
    var h='';for(var y=0;y<H;y++)for(var x=0;x<W;x++){
      var it=items.filter(function(o){return o.x===x&&o.y===y})[0],me=(y===H-1&&x===p);
      h+='<div class="lc" data-x="'+x+'">'+(it?'<span class="it pix" style="background-image:url('+TEX[mode==='esquiva'?'piedra':'regalo']+');background-size:100% 100%"></span>':'')+(me?(mode==='esquiva'?HERO:'<span class="it pix cart" style="background-image:url('+TEX.tablas+');background-size:100% 100%"></span>'):'')+'</div>';
    }
    ln.innerHTML=h;
    st.innerHTML=mode==='esquiva'?'Aguanta: <b>'+left+'</b> s · Vidas: '+lives:'Regalos: <b>'+score+'</b> / 10 · Escapados: '+miss+' / 3';
  }
  var over=false;function go(dx){if(over)return;p=Math.max(0,Math.min(W-1,p+dx));draw();if(check())over=true}
  function check(){
    for(var k=items.length-1;k>=0;k--){var o=items[k];
      if(o.y===H-1&&o.x===p){if(mode==='esquiva'){items.splice(k,1);lives--;beep([130],'sawtooth');shk(ln);if(lives<=0){draw();lose('¡Te han dado 3 rocas! Inténtalo otra vez.');return true}continue}score++;items.splice(k,1);beep([880]);if(score>=10){win();return true}}
      else if(o.y>=H){items.splice(k,1);if(mode==='atrapa'){miss++;beep([150]);if(miss>=3){lose('Se te escaparon 3 regalos.');return true}}}
    }
    return false;
  }
  $('#lL').onclick=function(){go(-1)};$('#lR').onclick=function(){go(1)};
  ln.onclick=function(e){var c=e.target.closest('.lc');if(c)go(+c.dataset.x>p?1:(+c.dataset.x<p?-1:0))};
  el._key=function(k){if(k==='ArrowLeft')go(-1);if(k==='ArrowRight')go(1)};
  el._s=function(){return {p:p,items:items}};
  every(function(){
    tick++;items.forEach(function(o){o.y++});
    if(tick%(mode==='esquiva'?3:2)===0&&!items.some(function(o){return o.y===0}))items.push({x:rint(0,W-1),y:0});
    if(over)return;if(check()){over=true;return}draw();
  },mode==='esquiva'?330:280);
  if(mode==='esquiva')every(function(){left--;if(left<=0){over=true;win()}},1000);
  draw();
}
GFN.esquiva=function(el,st,win,lose){lanes(el,st,win,lose,'esquiva')};
GFN.atrapa=function(el,st,win,lose){lanes(el,st,win,lose,'atrapa')};

/* 9 · serpiente de bloques */
GFN.serpiente=function(el,st,win,lose){
  var N=10,C=30,sn=[{x:4,y:5},{x:3,y:5},{x:2,y:5}],dir={x:1,y:0},nd=dir,food,eaten=0,need=8,img={};
  el.innerHTML='<canvas id="sk" class="pk pix" width="'+(N*C)+'" height="'+(N*C)+'"></canvas><div class="pad"><span></span><button data-d="0,-1" aria-label="Arriba">^</button><span></span><button data-d="-1,0" aria-label="Izquierda">&lt;</button><button data-d="0,1" aria-label="Abajo">v</button><button data-d="1,0" aria-label="Derecha">&gt;</button></div>';
  ['subsuelo','hojas','oro'].forEach(function(k){var im=new Image();im.src=TEX[k];img[k]=im});img.av=new Image();img.av.src=AV.head;
  var cv=$('#sk'),x=cv.getContext('2d');
  function place(){do{food={x:rint(0,N-1),y:rint(0,N-1)}}while(sn.some(function(s){return s.x===food.x&&s.y===food.y}))}
  function turn(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;nd={x:dx,y:dy}}
  el.querySelectorAll('.pad button').forEach(function(b){b.onclick=function(){var d=b.dataset.d.split(',');turn(+d[0],+d[1])}});
  el._key=function(k){var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];if(m)turn(m[0],m[1])};
  var sx=0,sy=0;cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  cv.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1)});
  el._s=function(){return {sn:sn,food:food,dir:dir,N:N}};
  function draw(){
    for(var j=0;j<N;j++)for(var i=0;i<N;i++){x.drawImage(img.subsuelo,i*C,j*C,C,C)}
    x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,N*C,N*C);
    x.fillStyle='#d83a2e';x.fillRect(food.x*C+6,food.y*C+8,C-12,C-12);x.fillStyle='#4f8a2c';x.fillRect(food.x*C+13,food.y*C+3,5,6);

/* 10 · sopa de letras */
GFN.sopa=function(el,st,win,lose,n,d){
  var own=normWord(d.word),pool=shuffle(WORDS.filter(function(w){return w.length<=8&&w!==own})),words=(own?[own]:[]).concat(pool).slice(0,4);
  var S=Math.max(8,own.length),g,placed,tries=0;
  do{g=[];placed=[];for(var j=0;j<S;j++){g[j]=[];for(var i=0;i<S;i++)g[j][i]=''}
    var ok=words.every(function(w){
      for(var t=0;t<200;t++){var dd=[[1,0],[0,1],[1,1]][rint(0,2)],x0=rint(0,S-1-(dd[0]?w.length-1:0)),y0=rint(0,S-1-(dd[1]?w.length-1:0));
        if(x0<0||y0<0)continue;
        var fits=true;for(var k=0;k<w.length;k++){var c=g[y0+dd[1]*k][x0+dd[0]*k];if(c&&c!==w[k]){fits=false;break}}
        if(fits){for(k=0;k<w.length;k++)g[y0+dd[1]*k][x0+dd[0]*k]=w[k];placed.push({w:w,x:x0,y:y0,dx:dd[0],dy:dd[1],found:false});return true}}
      return false});
  }while(!ok&&++tries<30);
  var AB='ABCDEFGHIJLMNOPRSTUVZ';for(j=0;j<S;j++)for(i=0;i<S;i++)if(!g[j][i])g[j][i]=AB[rint(0,AB.length-1)];
  el._s=function(){return placed};
  var sel=null;
  el.innerHTML='<div class="sopa" style="grid-template-columns:repeat('+S+',minmax(0,1fr))">'+g.map(function(r,y){return r.map(function(c,x){return '<button class="sl" data-x="'+x+'" data-y="'+y+'">'+c+'</button>'}).join('')}).join('')+'</div><p class="wl" id="wl"></p>';
  function list(){$('#wl').innerHTML=placed.map(function(p){return p.found?'<s>'+p.w+'</s>':p.w}).join(' · ');st.textContent='Toca la primera y la última letra de cada palabra · '+placed.filter(function(p){return p.found}).length+' / '+placed.length}
  function cell(x,y){return el.querySelector('.sl[data-x="'+x+'"][data-y="'+y+'"]')}
  list();
  el.querySelectorAll('.sl').forEach(function(b){b.onclick=function(){
    var x=+b.dataset.x,y=+b.dataset.y;
    if(!sel){sel={x:x,y:y};b.classList.add('pick');noise();return}
    cell(sel.x,sel.y).classList.remove('pick');
    var hit=placed.filter(function(p){if(p.found)return false;var ex=p.x+p.dx*(p.w.length-1),ey=p.y+p.dy*(p.w.length-1);return (p.x===sel.x&&p.y===sel.y&&ex===x&&ey===y)||(p.x===x&&p.y===y&&ex===sel.x&&ey===sel.y)})[0];
    sel=null;
    if(hit){hit.found=true;for(var k=0;k<hit.w.length;k++)cell(hit.x+hit.dx*k,hit.y+hit.dy*k).classList.add('got');beep([660,880]);list();if(placed.every(function(p){return p.found}))later(win,300)}
    else{beep([150]);shk(el.querySelector('.sopa'))}
  }});
};

/* 14 · pozo de lava (buscaminas) */
GFN.minas=function(el,st,win,lose){
  var N=6,M=6,mines=null,open={},flag={},flagMode=false;
  el.innerHTML='<div class="g6" id="mf"></div><div class="row ctr"><button id="fm">Modo marcar: no</button></div>';
  var f=$('#mf');
  for(var i=0;i<N*N;i++)f.insertAdjacentHTML('beforeend','<button class="cell mc pix" data-i="'+i+'" style="background-image:url('+TEX.piedra+')" aria-label="Casilla"></button>');
  var cs=f.querySelectorAll('.mc');
  function nb(i){var r=[],x=i%N,y=(i/N)|0;for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;var nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N)r.push(ny*N+nx)}return r}
  function count(i){return nb(i).filter(function(j){return mines[j]}).length}
  function seed(first){mines={};var safe=[first].concat(nb(first)),c=0;while(c<M){var k=rint(0,N*N-1);if(!mines[k]&&safe.indexOf(k)<0){mines[k]=1;c++}}}
  function reveal(i){
    if(open[i]||flag[i])return;open[i]=1;var c=cs[i];c.style.backgroundImage='url('+TEX.subsuelo+')';c.classList.add('op');
    var k=count(i);if(k){c.innerHTML='<b class="n'+k+'">'+k+'</b>'}else nb(i).forEach(reveal);
  }

  el._s=function(){return {mines:mines,open:open}};
  $('#fm').onclick=function(){flagMode=!flagMode;this.textContent='Modo marcar: '+(flagMode?'sí':'no');this.classList.toggle('on',flagMode)};
  cs.forEach(function(c){c.onclick=function(){
    var i=+c.dataset.i;if(open[i])return;
    if(flagMode){if(flag[i]){delete flag[i];c.innerHTML=''}else{flag[i]=1;c.innerHTML='<span class="it flag"></span>'}noise();status();return}
    if(flag[i])return;

    var left=Math.max(0,15-(now-t0)/1000);x.fillStyle='#fff';x.font='10px "Press Start 2P",monospace';x.fillText(Math.ceil(left)+' s',260,20);
    for(var j=0;j<obs.length;j++){var o=obs[j];if(40+20>o.x+2&&40<o.x+16&&py+20>G-o.h+2){dead=true;return lose('¡Te chocaste! Otra vez.')}}
    if(left<=0){dead=true;return win()}
    st.textContent='Aguanta '+Math.ceil(left)+' s';
    RAF=requestAnimationFrame(loop);
  })(t0);
};

  $('#sv').addEventListener('click',function(){D.to=$('#sTo').value.trim();D.from=$('#sFr').value.trim();D.intro=$('#sIn').value.trim();D.year=+$('#sY').value||D.year;D.sky=sky;D.sound=snd;D.games=gms;D.splash=spx;D.notify=ntf;if(msx!==(D.musica||'chill')){D.musica=msx;if(MUS.playing){musicStop();musicStart()}}
    if(!WEB){var p=$('#sPin').value.trim();if(drop)D.pin='';if(p){D.pin=hash(p);pinOK=true}}
    save('Ajustes guardados')});
}

function shrink(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1100/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- partículas ---------- */
var parts=[],running=false;
function burst(cx,cy,cols,count,speed){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var c=$('#cf');c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  for(var i=0;i<count;i++)parts.push({x:cx,y:cy,vx:(Math.random()-.5)*speed*2,vy:-Math.random()*speed-2,s:4+((Math.random()*3)|0)*3,c:cols[(Math.random()*cols.length)|0],life:60+Math.random()*60});
  if(!running){running=true;requestAnimationFrame(step)}
}
function step(){
  var c=$('#cf'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  parts=parts.filter(function(p){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.life--;x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);return p.life>0&&p.y<c.height+20});
  if(parts.length)requestAnimationFrame(step);else{running=false;c.hidden=true}
}

function snow(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var sky=$('#sky'),h='';
  for(var i=0;i<22;i++){h+='<i class="flake" style="left:'+(Math.random()*100)+'%;--dx:'+((Math.random()-.5)*60)+'px;animation-duration:'+(6+Math.random()*8)+'s;animation-delay:-'+(Math.random()*12)+'s"></i>'}
  sky.insertAdjacentHTML('beforeend',h);
}

    return u?Promise.resolve(u.canEdit()):!!art;
  }).then(function(v){webEdit=!!v;render()}).catch(function(){webEdit=false});
}
